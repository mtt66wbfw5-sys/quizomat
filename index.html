@media (pointer:coarse) and (min-width:561px){#app{padding:20px 24px calc(96px + env(safe-area-inset-bottom,0px))}.dstart{display:none}.mstart,.qfoot{display:block;position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:10px 24px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd);margin:0;z-index:5}.mstart .row,.qfoot .row{justify-content:center;max-width:560px;margin:0 auto;flex-wrap:nowrap}.mstart .btn,.qfoot .btn{flex:1;max-width:420px;padding:.75em 1.2em;font-size:1.02rem}}

<div id="app"></div>
<script>
const $app=document.getElementById('app');
let exp=new Set(),pq=null,col=new Set(),pend=null,rpend=null,cpend=null,gloss=[],courses={},cnames=[],gen={name:'',f:['single','multi','tf']},sets=[],sel=new Set(),opts={n:20,shuffle:true,hideMastered:true,mastery:3,examMins:30,pass:50,cpass:{}},Q=[],idx=0,picked=new Set(),checked=false,log=[],msg='';
let cedit=null,cdraft='',cpdraft=50,cerr='',sedit=null,sdraft=null,serr='',qedit=null,qdraft=null,qerr='',curView='q';
let examMode=false,examPicks=[],examMarks=new Set(),examEnd=0,examStart=0,examElapsed=0,examTimer=null,examSubPend=false,examTimeUp=false,examCourse='';
let gh={token:'',user:'',sha:'',lastSync:0},localTs=0,syncState='idle',syncErr='',syncTimer=null,forceOverwrite=false;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC={
  imp:`<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`,
  exp:`<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>`,
  res:`<svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>`,
  del:`<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`,
  edit:`<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>`,
  x:`<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
  cloud:`<svg viewBox="0 0 24 24"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>`,
  flag:`<svg viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>`
};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const toTop=()=>{window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0};
const stopExamTimer=()=>{if(examTimer){clearInterval(examTimer);examTimer=null}};
const fmtTime=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
const fmtPct=n=>String(Math.round(n*10)/10).replace('.',',')+' %';
const getPass=c=>(c&&opts.cpass&&[50,60,70].includes(+opts.cpass[c]))?+opts.cpass[c]:([50,60,70].includes(+opts.pass)?+opts.pass:50);
function selCourses(){const cs=new Set();sets.forEach(s=>{if(sel.has(s.id))cs.add(s.course)});return[...cs]}
function activePass(){const cs=selCourses();return cs.length===1?getPass(cs[0]):getPass('')}
function setActivePass(v,crs){const p=[50,60,70].includes(+v)?+v:50;if(!opts.cpass||typeof opts.cpass!=='object')opts.cpass={};if(crs){opts.cpass[crs]=p}else{opts.pass=p;selCourses().forEach(c=>{opts.cpass[c]=p})}saveO()}
function calcGrade(pct,pass){
  const p=[50,60,70].includes(+pass)?+pass:50,st=(100-p)/4;
  if(pct>=p+3*st)return{g:1,t:'Sehr gut',ok:true,p,st};
  if(pct>=p+2*st)return{g:2,t:'Gut',ok:true,p,st};
  if(pct>=p+st)return{g:3,t:'Befriedigend',ok:true,p,st};
  if(pct>=p)return{g:4,t:'Genügend',ok:true,p,st};
  return{g:5,t:'Nicht genügend',ok:false,p,st};
}
function load(){
  try{sets=JSON.parse(localStorage.getItem('pt:sets')||'[]')}catch(e){sets=[]}
  try{courses=JSON.parse(localStorage.getItem('pt:courses')||'{}')}catch(e){courses={}}
  try{gloss=JSON.parse(localStorage.getItem('pt:gloss')||'[]')}catch(e){gloss=[]}
  try{col=new Set(JSON.parse(localStorage.getItem('pt:col')||'[]'))}catch(e){col=new Set()}
  try{const o=JSON.parse(localStorage.getItem('pt:opts')||'null');if(o&&typeof o==='object')opts={...opts,...o,n:Math.max(1,+o.n||20),examMins:Math.max(1,+o.examMins||30),pass:[50,60,70].includes(+o.pass)?+o.pass:50,cpass:(o.cpass&&typeof o.cpass==='object')?o.cpass:{},shuffle:true,hideMastered:true,mastery:3}}catch(e){}
  try{localTs=+localStorage.getItem('pt:ts')||0}catch(e){localTs=0}
  try{const g=JSON.parse(localStorage.getItem('pt:gh')||'null');if(g&&typeof g==='object')gh={...gh,...g}}catch(e){}
}
function saveGH(){try{localStorage.setItem('pt:gh',JSON.stringify(gh))}catch(e){}}
function touchLocal(overwrite){
  localTs=Date.now();
  if(overwrite)forceOverwrite=true;
  try{localStorage.setItem('pt:ts',String(localTs))}catch(e){}
  if(gh.token){clearTimeout(syncTimer);syncTimer=setTimeout(()=>pushCloudNow(),600)}
}
function saveO(){try{localStorage.setItem('pt:opts',JSON.stringify(opts))}catch(e){}touchLocal()}
function saveC(){try{localStorage.setItem('pt:courses',JSON.stringify(courses))}catch(e){}touchLocal()}
function saveCol(){try{localStorage.setItem('pt:col',JSON.stringify([...col]))}catch(e){}touchLocal()}
function saveGloss(ow){try{localStorage.setItem('pt:gloss',JSON.stringify(gloss))}catch(e){}touchLocal(ow)}
function save(ow){try{localStorage.setItem('pt:sets',JSON.stringify(sets))}catch(e){}touchLocal(ow)}

const isMastered=q=>(q.streak||0)>=opts.mastery;
const qWeight=q=>{
  if(isMastered(q))return opts.hideMastered?0:1;
  const st=q.streak||0;
  if(st===0)return q.wrong?6:4;
  if(st===1)return 2;
  return 1;
};
const pool1=s=>opts.hideMastered?s.qs.filter(q=>!isMastered(q)):s.qs;
const masteredInSet=s=>s.qs.filter(isMastered).length;
const hasAnyProgress=()=>sets.some(s=>s.qs.some(q=>(q.streak||0)>0||q.wrong));

const PROMPT=`Erstelle aus den angehängten Unterlagen [ANZAHL] Prüfungsfragen als JSON. Mische Single Choice (typ "single"), Multiple Choice mit mehreren richtigen Antworten (typ "multi") und Wahr/Falsch (typ "tf"). Falsche Antworten sollen plausibel sein und typische Verwechslungen aus dem Stoff abbilden. Gib nur einen JSON-Codeblock in genau diesem Format aus:

{"kurs":"Name des Kurses","titel":"Thema / Vorlesung","fragen":[
 {"typ":"single","frage":"…","optionen":["A","B","C","D"],"richtig":[1],"erklaerung":"Warum die richtige Antwort stimmt.","begruendungen":["Warum A falsch ist","Warum B richtig ist","…","…"]},
 {"typ":"multi","frage":"…","optionen":["…","…","…","…"],"richtig":[0,2],"erklaerung":"…"},
 {"typ":"tf","frage":"Aussage …","richtig":true,"erklaerung":"…"}
]}

"richtig" enthält die Indizes (ab 0) der richtigen Optionen. "begruendungen" ist optional und enthält pro Option eine kurze Begründung.`;

function parseSets(txt){
  let d;try{d=JSON.parse(txt.trim().replace(/^```(?:json)?|```$/g,'').trim())}catch(e){throw new Error('Kein gültiges JSON: '+e.message)}
  const list=Array.isArray(d)?d:[d],out=[];
  list.forEach((s,si)=>{
    if(s&&Array.isArray(s.glossar)&&!s.fragen)return;
    if(!s||!Array.isArray(s.fragen)||!s.fragen.length)throw new Error('Set '+(si+1)+': „fragen“ fehlt oder ist leer.');
    const qs=s.fragen.map((f,i)=>{
      const w='Frage '+(i+1)+': ';
      if(!f.frage)throw new Error(w+'„frage“ fehlt.');
      const st=Math.max(0,parseInt(f.streak,10)||0),wr=!!f.wrong,fl=!!(f.flagged||f.markiert);
      if(f.typ==='tf'){
        const t=f.richtig===true||(Array.isArray(f.richtig)&&f.richtig[0]===0);
        return{q:f.frage,type:'single',exp:f.erklaerung||'',opts:[{t:'Wahr',ok:t,why:''},{t:'Falsch',ok:!t,why:''}],fixed:true,streak:st,wrong:wr,flagged:fl};
      }
      if(!Array.isArray(f.optionen)||f.optionen.length<2)throw new Error(w+'mindestens 2 „optionen“ nötig.');
      const raw=[].concat(f.richtig??[]);
      const r=raw.map(x=>typeof x==='number'||(typeof x==='string'&&x.trim()!=='')?Number(x):NaN);
      if(!r.length||r.some(x=>!(x>=0&&x<f.optionen.length)))throw new Error(w+'„richtig“ verweist auf eine nicht vorhandene Option.');
      return{q:f.frage,type:(f.typ==='multi'||r.length>1)?'multi':'single',exp:f.erklaerung||'',streak:st,wrong:wr,flagged:fl,
        opts:f.optionen.map((t,k)=>({t:String(t),ok:r.includes(k),why:(f.begruendungen&&f.begruendungen[k])||''}))};
    });
    out.push({id:Date.now().toString(36)+'-'+si,course:s.kurs||'Ohne Kurs',title:s.titel||'Ohne Titel',qs});
  });
  return out;
}

function weightedPick(cands,count){
  const pool=cands.slice(),out=[];
  while(out.length<count&&pool.length){
    const ws=pool.map(q=>Math.max(1,qWeight(q._ref||q)));
    const sum=ws.reduce((a,b)=>a+b,0);
    let r=Math.random()*sum,pickIdx=pool.length-1;
    for(let i=0;i<pool.length;i++){r-=ws[i];if(r<=0){pickIdx=i;break}}
    out.push(pool.splice(pickIdx,1)[0]);
  }
  return out;
}

function startExam(){
  stopExamTimer();
  const selSets=[...sel].map(id=>sets.find(x=>x.id===id)).filter(s=>s&&s.qs.length);
  if(!selSets.length)return;
  const totalAll=selSets.reduce((a,s)=>a+s.qs.length,0),target=Math.min(opts.n,totalAll);
  const pools=selSets.map(s=>{const exact=s.qs.length/totalAll*target;return{s,qs:shuf(s.qs),take:Math.floor(exact),rem:exact-Math.floor(exact)}});
  let left=target-pools.reduce((a,p)=>a+p.take,0);
  shuf(pools).sort((a,b)=>b.rem-a.rem).forEach(p=>{if(left>0&&p.take<p.qs.length){p.take++;left--}});
  const cands=[];
  pools.forEach(p=>p.qs.slice(0,p.take).forEach(q=>cands.push({...q,_ref:q._ref||q,_course:p.s.course,_title:p.s.title})));

function has(t,w,short){let i=t.indexOf(w);while(i>=0){if(!short)return true;const a=t[i-1]||' ',b=t[i+w.length]||' ';if(!/[a-zäöüß]/.test(a)&&!/[a-zäöüß]/.test(b))return true;i=t.indexOf(w,i+1)}return false}
function terms(q){const t=(q.q+' '+q.opts.map(o=>o.t).join(' ')+' '+q.exp).toLowerCase();return gloss.filter(g=>[g.b,...g.a].some(w=>{w=w.toLowerCase();return has(t,w,w.length<=4)})).slice(0,6)}
function side(q){
  if(!checked)return `<div class='card ph'><p class='mut' style='margin:0'>Nach dem Prüfen der Antwort erscheinen hier die Erklärung und passende Begriffe aus dem Glossar.</p></div>`;
  const src=q._ref||q,st=src.streak||0,m=isMastered(src),t=terms(q),whys=q.opts.filter(o=>o.why);
  return `<div class="exp" style="margin:0"><div class="row" style="justify-content:space-between;margin-bottom:4px"><b>${log[idx]?'Richtig.':'Nicht ganz.'}</b><span class="badge ${m?'ok':src.wrong?'bad':''}" style="cursor:default">${m?`✓ Gemeistert (${st}/${opts.mastery})`:`Lernstand: ${st} / ${opts.mastery}`}</span></div>${esc(q.exp)}${whys.length?`<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--bd)">${whys.map(o=>`<p class="why" style="margin:4px 0"><b style="color:var(${o.ok?'--ok':'--bad'})">${o.ok?'✓':'✕'} ${esc(o.t)}:</b> ${esc(o.why)}</p>`).join('')}</div>`:''}</div><div class='card'><b>Weiterführende Informationen</b>${t.length?t.map(g=>`<p class='term'><b>${esc(g.b)}</b> – ${esc(g.i)}</p>`).join(''):`<p class='mut'>Zu dieser Frage ist noch kein Begriff im Glossar hinterlegt.</p>`}</div>`}
function addGloss(l,noSave){l.forEach(g=>{if(!g||!g.begriff||!g.info)return;const o={b:String(g.begriff),i:String(g.info),a:[].concat(g.alias||[]).map(String)};const i=gloss.findIndex(x=>x.b.toLowerCase()===o.b.toLowerCase());i<0?gloss.push(o):gloss[i]=o});if(!noSave)saveGloss()}
function wrongPool(){return Q.filter((_,i)=>!log[i])}

const b64Enc=s=>{let b='';const u=new TextEncoder().encode(s);for(let i=0;i<u.length;i++)b+=String.fromCharCode(u[i]);return btoa(b)};
const b64Dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s+/g,'')),c=>c.charCodeAt(0)));
const SYNC_REPO='quizomat-sync',SYNC_FILE='state.json';

async function ghReq(method,path,body,tok){
  const r=await fetch('https://api.github.com'+path,{
    method,cache:'no-store',
    headers:{Authorization:'Bearer '+(tok||gh.token),Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{})},
    body:body?JSON.stringify(body):undefined
  });
  const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null}catch(e){}
  return{status:r.status,ok:r.ok,data:j};
}

async function ensureCloudRepo(tok){
  const u=await ghReq('GET','/user',null,tok);
  if(!u.ok||!u.data||!u.data.login)throw new Error('Ungültiger GitHub-Token oder fehlende Berechtigung.');
  const login=u.data.login;
  const rp=await ghReq('GET',`/repos/${login}/${SYNC_REPO}`,null,tok);
  if(rp.status===404){
    const cr=await ghReq('POST','/user/repos',{name:SYNC_REPO,private:true,auto_init:true,description:'Privater Cloud-Speicher für Quizomat'},tok);
    if(!cr.ok)throw new Error('Privates Sync-Repository konnte nicht angelegt werden (hat der Token die „repo“-Berechtigung?).');
  }
  return login;
}

async function fetchCloudState(){
  if(!gh.user)gh.user=await ensureCloudRepo(gh.token);
  const r=await ghReq('GET',`/repos/${gh.user}/${SYNC_REPO}/contents/${SYNC_FILE}`);
  if(r.status===404)return{sha:'',data:null};
  if(!r.ok)throw new Error('Fehler beim Laden aus der Cloud ('+r.status+').');
  let raw=r.data.content||'';
  if(!raw&&r.data.sha){
    const bl=await ghReq('GET',`/repos/${gh.user}/${SYNC_REPO}/git/blobs/${r.data.sha}`);
    if(bl.ok&&bl.data)raw=bl.data.content||'';
  }
  const parsed=raw?JSON.parse(b64Dec(raw)):null;
  return{sha:r.data.sha||'',data:parsed};
}

function applyCloudState(d){
  if(!d||typeof d!=='object')return;
  const prevSel=new Set(sel),hadSets=sets.length>0;
  if(Array.isArray(d.sets))sets=d.sets;
  if(Array.isArray(d.gloss))gloss=d.gloss;
  if(d.courses&&typeof d.courses==='object')courses=d.courses;
  if(Array.isArray(d.col))col=new Set(d.col);
  if(d.opts&&typeof d.opts==='object')opts={...opts,...d.opts,n:Math.max(1,+d.opts.n||20),examMins:Math.max(1,+d.opts.examMins||30),pass:[50,60,70].includes(+d.opts.pass)?+d.opts.pass:50,cpass:(d.opts.cpass&&typeof d.opts.cpass==='object')?d.opts.cpass:{},shuffle:true,hideMastered:true,mastery:3};
  localTs=d.updatedAt||Date.now();
  try{
    localStorage.setItem('pt:sets',JSON.stringify(sets));
    localStorage.setItem('pt:gloss',JSON.stringify(gloss));
    localStorage.setItem('pt:courses',JSON.stringify(courses));
    localStorage.setItem('pt:col',JSON.stringify([...col]));
    localStorage.setItem('pt:opts',JSON.stringify(opts));
    localStorage.setItem('pt:ts',String(localTs));
  }catch(e){}
  sel=new Set();
  sets.forEach(s=>{if(!hadSets||prevSel.has(s.id))sel.add(s.id)});
  if(!sel.size)sets.forEach(s=>sel.add(s.id));
}

async function pushCloudNow(retry){
  if(!gh.token)return;
  clearTimeout(syncTimer);
  syncState='syncing';syncErr='';updSyncUI();
  try{
    if(!gh.user)gh.user=await ensureCloudRepo(gh.token);
    if(!gh.sha&&!retry){
      const cur=await fetchCloudState();
      gh.sha=cur.sha;
    }
    if(!localTs){localTs=Date.now();try{localStorage.setItem('pt:ts',String(localTs))}catch(e){}}
    const payload={updatedAt:localTs,sets,gloss,courses,col:[...col],opts};
    const res=await ghReq('PUT',`/repos/${gh.user}/${SYNC_REPO}/contents/${SYNC_FILE}`,{
      message:'Sync Quizomat',
      content:b64Enc(JSON.stringify(payload)),
      ...(gh.sha?{sha:gh.sha}:{})
    });
    if((res.status===409||res.status===422)&&!retry){
      const cur=await fetchCloudState();
      gh.sha=cur.sha;
      if(!forceOverwrite&&cur.data){
        if(Array.isArray(cur.data.sets))mergeSets(cur.data.sets);
        if(Array.isArray(cur.data.gloss))addGloss(cur.data.gloss.map(g=>({begriff:g.b,info:g.i,alias:g.a})),true);
        try{localStorage.setItem('pt:sets',JSON.stringify(sets));localStorage.setItem('pt:gloss',JSON.stringify(gloss))}catch(e){}
      }
      return await pushCloudNow(true);
    }
    if(!res.ok)throw new Error('Speichern in Cloud fehlgeschlagen ('+res.status+').');
    gh.sha=(res.data&&res.data.content&&res.data.content.sha)||gh.sha;
    gh.lastSync=Date.now();forceOverwrite=false;saveGH();
    syncState='ok';updSyncUI();
  }catch(e){
    syncState='err';syncErr=e.message||'Synchronisationsfehler';updSyncUI();
  }
}

async function pullCloud(isConnect){
  if(!gh.token)return;
  syncState='syncing';syncErr='';updSyncUI();
  try{
    const rem=await fetchCloudState();
    gh.sha=rem.sha;
    const d=rem.data,remTs=(d&&d.updatedAt)||0;
    if(isConnect){
      if(d&&(sets.length||gloss.length)){
        if(Array.isArray(d.sets))mergeSets(d.sets);
        if(Array.isArray(d.gloss))addGloss(d.gloss.map(g=>({begriff:g.b,info:g.i,alias:g.a})),true);
        localTs=Date.now();
        try{localStorage.setItem('pt:sets',JSON.stringify(sets));localStorage.setItem('pt:gloss',JSON.stringify(gloss));localStorage.setItem('pt:ts',String(localTs))}catch(e){}
        await pushCloudNow(true);
      }else if(d){
        applyCloudState(d);
        gh.lastSync=Date.now();saveGH();syncState='ok';
      }else{
        await pushCloudNow(true);
      }
    }else if(d&&remTs>localTs){
      applyCloudState(d);
      gh.lastSync=Date.now();saveGH();syncState='ok';
    }else if(localTs>remTs&&(sets.length||gloss.length||forceOverwrite)){
      await pushCloudNow(true);
      return;
    }else{
      gh.lastSync=Date.now();saveGH();syncState='ok';
    }
    updSyncUI();
    if(curView==='q'&&cedit===null&&sedit===null&&qedit===null&&!qsearch)home();
    else if(curView==='g'&&gedit===null&&!gq)glosView();
  }catch(e){
    syncState='err';syncErr=e.message||'Synchronisationsfehler';updSyncUI();
  }
}

function cloudView(){
  const chg=curView!=='c';curView='c';$app.className='';
  const last=gh.lastSync?new Date(gh.lastSync).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'})+' Uhr':'Noch nicht synchronisiert';
  $app.innerHTML=`${nav('c')}<h1>Cloud-Sync</h1>
  <p class="mut">Synchronisiert deine Fragen, deinen Lernstand und dein Glossar automatisch über ein privates GitHub-Repository (<b>${SYNC_REPO}</b>) zwischen Mac und iPhone.</p>
  ${gh.token?`<div class="card" style="margin-top:14px">
    <p><b>Status:</b> ${syncState==='syncing'?'Synchronisiere …':syncState==='err'?`<span style="color:var(--bad)">Fehler (${esc(syncErr)})</span>`:`<span style="color:var(--ok)">✓ Verbunden${gh.user?` als @${esc(gh.user)}`:''}</span>`}</p>
    <p class="mut">Privates Repository: <code>${esc(gh.user||'…')}/${SYNC_REPO}</code><br>Letzter Abgleich: ${esc(last)}</p>
    <div class="row" style="margin-top:12px">
      <button class="btn" ${syncState==='syncing'?'disabled':''} onclick="pullCloud(false)">Jetzt synchronisieren</button>
      <button class="btn sec" onclick="disconnectCloud()">Verbindung trennen</button>
    </div>
  </div>`:`<div class="card ge" style="margin-top:14px">
    <label for="ght"><b>GitHub Personal Access Token</b></label>
    <p class="mut" style="margin:2px 0 8px">Gib deinen GitHub-Token (<code>ghp_…</code> mit <code>repo</code>-Berechtigung) ein. Der Token wird ausschließlich lokal auf diesem Gerät gespeichert.</p>
    <input id="ght" type="password" placeholder="ghp_…" autocomplete="off">
    <p class="err">${esc(syncErr)}</p>
    <div class="row" style="margin-top:8px">
      <button class="btn" ${syncState==='syncing'?'disabled':''} onclick="connectCloud()">${syncState==='syncing'?'Verbinde …':'Verbinden & Synchronisieren'}</button>
    </div>
  </div>`}`;
  if(chg)toTop();
}

async function connectCloud(){
  const el=document.getElementById('ght'),tok=(el?el.value:'').trim();
  if(!tok){syncErr='Bitte gib einen GitHub-Token ein.';cloudView();return}
  syncState='syncing';syncErr='';cloudView();
  try{
    const user=await ensureCloudRepo(tok);
    gh={token:tok,user,sha:'',lastSync:0};
    saveGH();
    await pullCloud(true);
  }catch(e){
    gh={token:'',user:'',sha:'',lastSync:0};saveGH();
    syncState='err';syncErr=e.message||'Verbindung fehlgeschlagen.';cloudView();
  }
}

function disconnectCloud(){
  clearTimeout(syncTimer);
  gh={token:'',user:'',sha:'',lastSync:0};syncState='idle';syncErr='';
  try{localStorage.removeItem('pt:gh')}catch(e){}
  cloudView();
}

const autoPull=()=>{if(document.visibilityState==='visible'&&gh.token&&syncState!=='syncing')pullCloud(false)};
document.addEventListener('visibilitychange',autoPull);
window.addEventListener('focus',autoPull);
window.addEventListener('pageshow',autoPull);
window.addEventListener('online',autoPull);

document.addEventListener('keydown',ev=>{
  if(!$app.classList.contains('wide')||!Q.length)return;
  const tag=(ev.target&&ev.target.tagName)||'';
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
  if(examMode){
    if(ev.key>='1'&&ev.key<='9'){
      const k=+ev.key-1;
      if(Q[idx]&&Q[idx].opts[k]){ev.preventDefault();pick(k)}
    }else if(ev.key==='ArrowLeft'){
      if(idx>0){ev.preventDefault();goExamQ(idx-1)}
    }else if(ev.key==='ArrowRight'||(ev.key==='Enter'&&tag!=='BUTTON')){
      if(idx+1<Q.length){ev.preventDefault();goExamQ(idx+1)}
    }else if((ev.key==='l'||ev.key==='L')&&!ev.metaKey&&!ev.ctrlKey&&!ev.altKey){
      ev.preventDefault();togExamMark();
    }else if((ev.key==='m'||ev.key==='M')&&!ev.metaKey&&!ev.ctrlKey&&!ev.altKey){
      ev.preventDefault();togQuizFlag();
    }else if(ev.key==='Escape'){
      ev.preventDefault();home();
    }
    return;
  }
  if(ev.key>='1'&&ev.key<='9'&&!checked){
    const k=+ev.key-1;
    if(Q[idx]&&Q[idx].opts[k]){ev.preventDefault();pick(k)}
  }else if((ev.key==='Enter'||ev.key===' ')&&tag!=='BUTTON'){
    if(!checked&&picked.size){ev.preventDefault();check()}
    else if(checked){ev.preventDefault();next()}
  }else if((ev.key==='m'||ev.key==='M')&&!ev.metaKey&&!ev.ctrlKey&&!ev.altKey){
    ev.preventDefault();togQuizFlag();
  }else if(ev.key==='Escape'){
    ev.preventDefault();home();
  }
});

load();sets.forEach(s=>sel.add(s.id));home();if(gh.token)pullCloud(false);
</script>
